[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engsys"
version = "0.1.0"
description = "Engineering part record, gate checks and documents (DFMEA, PFMEA, control plan, inspection plan, FAI, BOM, routing, ECN)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18", "numpy>=1.24", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
engsys = "engsys.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
engsys = ["schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
